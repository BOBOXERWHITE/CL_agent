name: Eval Gate

# Runs on every PR + manual dispatch. Two jobs:
#
#   eval-unit-tests
#     Validates the eval-machinery itself (regression diff math, LLM-as-
#     judge contract, dataset loader, context metrics, CLI). Fast,
#     deterministic, no external infra. Always required to pass.
#
#   eval-gate-demo
#     End-to-end demo of the gate CLI on a pre-baked metrics fixture so
#     contributors can see what the GitHub Actions summary card looks like
#     when a PR regresses. Doesn't gate on the result — it's a visual aid.
#
# To make the *real* regression gate block your PR, fork this file and
# replace the demo job with one that calls your eval endpoint, e.g.:
#
#     curl -s "$EVAL_API_URL/api/evals/runs/$RUN_ID" \
#       | jq .metrics \
#       | python backend/scripts/eval_gate_cli.py --stdin
#
# Anything non-zero blocks the merge.

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/app/services/eval/**"
      - "backend/app/schemas/eval.py"
      - "backend/app/api/routes/evals.py"
      - "backend/data/eval/**"
      - "backend/scripts/eval_gate_cli.py"
      - "backend/tests/eval/**"
      - ".github/workflows/eval-gate.yml"
  workflow_dispatch:

jobs:
  eval-unit-tests:
    name: Eval unit tests
    runs-on: ubuntu-latest
    env:
      # Force deterministic providers so no real LLM / embedding calls
      # happen in CI — keeps the workflow free and reproducible.
      LLM_PROVIDER: deterministic
      EMBEDDING_PROVIDER: deterministic
      LLM_API_KEY: ""
      EMBEDDING_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (dev extras)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run eval unit tests
        working-directory: backend
        run: pytest tests/eval/ -v --tb=short

      - name: Run eval CLI gate tests
        working-directory: backend
        # Separate step so the GitHub Actions log clearly attributes a
        # failure to the CLI tooling vs. the metric math.
        run: pytest tests/eval/test_eval_gate_cli.py -v --tb=short

  eval-gate-demo:
    name: Eval gate demo
    runs-on: ubuntu-latest
    needs: eval-unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate a sample regressed metrics fixture
        run: |
          mkdir -p /tmp/eval
          cat > /tmp/eval/metrics.json <<'JSON'
          {
            "answer_correctness": 0.62,
            "citation_hit_rate": 0.75,
            "retrieval_mrr": 0.7,
            "low_confidence_rate": 0.28,
            "quality_gate": "warn",
            "quality_gate_reasons": [
              "答案正确率低于 80%",
              "低置信度占比高于 20%"
            ],
            "judge_answer_correctness": 0.66,
            "faithfulness": 0.72,
            "context_precision": 0.68,
            "context_recall": 0.81,
            "judge_prompt_tokens_total": 3200,
            "judge_completion_tokens_total": 600,
            "judge_cost_usd_total": 0.0042,
            "regression": {
              "has_previous": true,
              "previous_run_id": "demo-run-abc123",
              "regression_gate": "warn",
              "regression_reasons": [
                "judge_answer_correctness: 0.8500 → 0.6600 (Δ -0.1900)"
              ],
              "deltas": []
            }
          }
          JSON

      - name: Run gate CLI (advisory mode)
        # This run intentionally surfaces a warn state without failing
        # the workflow, so the demo always shows the summary card.
        working-directory: backend
        run: python scripts/eval_gate_cli.py /tmp/eval/metrics.json
        env:
          # GITHUB_STEP_SUMMARY is set automatically by Actions; the CLI
          # appends to it so the summary lands as a card on the run page.
          PYTHONPATH: ${{ github.workspace }}/backend
