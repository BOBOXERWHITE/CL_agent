[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-ops-copilot-backend"
version = "0.1.0"
description = "Backend for Travel Ops Copilot"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn>=0.35,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<9.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
