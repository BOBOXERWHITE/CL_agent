[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-ops-copilot-backend"
version = "0.1.0"
description = "Backend for Travel Ops Copilot"
requires-python = ">=3.13"
dependencies = [
  "celery>=5.5,<6.0",
  "fastapi>=0.116,<1.0",
  "minio>=7.2,<8.0",
  "psycopg[binary]>=3.2,<4.0",
  "pymilvus>=2.5,<3.0",
  "pypdf>=5.4,<6.0",
  "python-multipart>=0.0.20,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn>=0.35,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<9.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
