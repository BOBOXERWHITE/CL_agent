# Alembic configuration for Travel Ops Copilot backend.
#
# The DATABASE_URL is NOT read from here at runtime. Instead, alembic/env.py
# loads it from app.core.config.get_settings(), which reads from environment
# variables (consistent with the rest of the app). The sqlalchemy.url below
# is only a placeholder to keep alembic happy when the CLI is invoked.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = driver://placeholder/ignored_see_env_py

# File naming: 0001_baseline.py, 0002_add_xxx.py, ...
file_template = %%(rev)s_%%(slug)s

# Timezone for new revisions (UTC keeps it deterministic across contributors)
timezone = UTC

[post_write_hooks]
# Future: wire ruff format here once P0.6 lands

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
