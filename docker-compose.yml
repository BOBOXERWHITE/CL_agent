services:
  postgres:
    image: postgres:16
    container_name: travel-ops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travel_ops}
      POSTGRES_USER: ${POSTGRES_USER:-travel_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travel_ops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-travel_ops} -d ${POSTGRES_DB:-travel_ops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: travel-ops-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-02-03T21-03-04Z
    container_name: travel-ops-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: travel-ops-etcd
    command: >-
      etcd
      --advertise-client-urls=http://127.0.0.1:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    ports:
      - "${ETCD_PORT:-2379}:2379"
    volumes:
      - etcd_data:/etcd

  milvus:
    image: milvusdb/milvus:v2.5.8
    container_name: travel-ops-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      etcd:
        condition: service_started
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_HTTP_PORT:-9091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus

  attu:
    image: zilliz/attu:v2.5.10
    container_name: travel-ops-attu
    environment:
      MILVUS_URL: milvus:19530
    depends_on:
      milvus:
        condition: service_started
    ports:
      - "${ATTU_PORT:-18000}:3000"

  # P8 (Observability): Arize Phoenix — OpenInference-native LLM/agent
  # trace UI. Backend exports OTLP HTTP to phoenix:6006/v1/traces. Free,
  # self-hosted, OpenTelemetry standard. To use:
  #   1. Run `docker compose up -d phoenix`
  #   2. Set PHOENIX_ENDPOINT=http://localhost:6006/v1/traces (or
  #      OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:6006/v1/traces)
  #   3. Restart backend; ask a question
  #   4. Open http://localhost:6006 to see the trace tree
  #
  # If your Docker pulls through a China mirror (daocloud / aliyun) and
  # it returns 403 for arizephoenix, either: (a) configure Docker
  # Desktop → Settings → Docker Engine to drop that mirror from
  # registry-mirrors so this image pulls direct from docker.io, or (b)
  # swap to ``jaegertracing/all-in-one:latest`` (UI on :16686, OTLP on
  # :4318) — Jaeger lacks the LLM-trace UI but every mirror has it.
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: travel-ops-phoenix
    ports:
      - "${PHOENIX_HTTP_PORT:-6006}:6006"   # UI + OTLP HTTP endpoint
      - "${PHOENIX_GRPC_PORT:-4317}:4317"   # OTLP gRPC (optional)
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix_data:/mnt/data
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  etcd_data:
  milvus_data:
  phoenix_data:
