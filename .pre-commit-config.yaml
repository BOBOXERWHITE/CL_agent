# Pre-commit hooks for Travel Ops Copilot.
#
# Install once per clone:
#   cd backend && pip install -e ".[dev]"   # installs ruff + pre-commit
#   cd .. && pre-commit install
#
# Run manually on all files:
#   pre-commit run --all-files
#
# This config uses ``language: system`` so hooks invoke the ruff / mypy from
# the project's dev virtualenv rather than creating throwaway environments in
# ~/.cache/pre-commit. This keeps the setup fast and avoids disk-space issues
# on Windows where the user profile drive may be small.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        entry: ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        files: ^backend/.*\.py$
      - id: ruff-format
        name: ruff format (backend)
        entry: ruff format
        language: system
        types: [python]
        files: ^backend/.*\.py$

# mypy hook intentionally omitted from pre-commit while the repo still has
