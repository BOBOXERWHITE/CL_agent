apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: travel-ops-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
spec:
  ingressClassName: nginx
  rules:
    - host: travel-ops.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: travel-ops-api
                port:
                  number: 8000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: travel-ops-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: travel-ops-web
                port:
                  number: 80
