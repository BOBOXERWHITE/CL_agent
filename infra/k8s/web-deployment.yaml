apiVersion: v1
kind: Service
metadata:
  name: travel-ops-web
  labels:
    app: travel-ops-web
spec:
  selector:
    app: travel-ops-web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-ops-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travel-ops-web
  template:
    metadata:
      labels:
        app: travel-ops-web
    spec:
      containers:
        - name: web
          image: travel-ops-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
