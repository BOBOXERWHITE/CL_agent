apiVersion: v1
kind: ConfigMap
metadata:
  name: travel-ops-config
data:
  APP_NAME: Travel Ops Copilot API
  APP_ENV: production
  LOG_LEVEL: INFO
  CORS_ALLOW_ORIGINS: https://travel-ops.example.com
  OBJECT_STORAGE_PROVIDER: minio
  VECTOR_STORE_PROVIDER: milvus
  MINIO_ENDPOINT: minio:9000
  MINIO_BUCKET_NAME: knowledge
  MINIO_SECURE: "false"
  MILVUS_HOST: milvus
  MILVUS_PORT: "19530"
  MILVUS_COLLECTION_NAME: knowledge_chunks
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CELERY_TASK_ALWAYS_EAGER: "false"
  CHAT_TOP_K: "3"
  CHAT_CONFIDENCE_THRESHOLD: "0.2"
  AUTH_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: travel-ops-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://travel_ops:travel_ops@postgres:5432/travel_ops
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin123
  AUTH_ADMIN_TOKENS: change-me-admin-token
  AUTH_OPERATOR_TOKENS: change-me-operator-token
  AUTH_REVIEWER_TOKENS: change-me-reviewer-token
---
apiVersion: v1
kind: Service
metadata:
  name: travel-ops-api
  labels:
    app: travel-ops-api
spec:
  selector:
    app: travel-ops-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-ops-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travel-ops-api
  template:
    metadata:
      labels:
        app: travel-ops-api
    spec:
      containers:
        - name: api
          image: travel-ops-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: travel-ops-config
            - secretRef:
                name: travel-ops-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
